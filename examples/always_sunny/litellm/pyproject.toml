# What this example's LiteLLM image installs: LiteLLM's proxy at one version,
# and the guardrail for it from inspect_sentinel's release. It exists for the
# uv.lock beside it, which the Dockerfile here installs exactly. Nothing is
# built or published from here.
#
# To move to newer releases, change the versions below, run `uv lock` in this
# folder, and commit uv.lock.
[project]
name = "always-sunny-litellm"
version = "0"
requires-python = ">=3.13"
dependencies = [
    "inspect-sentinel-litellm",
    "litellm[proxy]==1.105.0",
]

[tool.uv]
package = false
required-version = ">=0.13.4"
# only releases at least 7 days old, as in the repository's own pyproject.toml
exclude-newer = "7 days"

# The guardrail isn't on PyPI. uv.lock records the commit of inspect_sentinel's
# 0.3.1 tag, which holds it.
[tool.uv.sources]
inspect-sentinel-litellm = { git = "https://github.com/meridianlabs-ai/inspect_sentinel", tag = "0.3.1", subdirectory = "src/proxies/litellm" }
