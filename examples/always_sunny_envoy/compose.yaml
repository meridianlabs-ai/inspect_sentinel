# The always_sunny example behind Envoy: Envoy in front of the model
# providers, and the sidecar deciding for it. See README.md.
services:
  envoy:
    image: envoyproxy/envoy:v1.39.6@sha256:1fde8efee875e4e4f6a39a90fe49d9338e1caacce5762034ef9fb4bbb9ad6aed
    depends_on:
      sidecar:
        condition: service_healthy
    command:
      - --config-path
      - /config/envoy.yaml
      - --log-level
      - warning
    volumes:
      # written by `python -m inspect_sentinel.sidecar.envoy`
      - ./envoy.yaml:/config/envoy.yaml:ro
    ports:
      - 127.0.0.1:8080:8080

  sidecar:
    build:
      context: .
      dockerfile: sidecar/Dockerfile
    command:
      - --sentinel
      - /sentinel/sentinel.yaml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8900/health')"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - ./sentinel.yaml:/sentinel/sentinel.yaml:ro
    # no port is published: only Envoy reaches the sidecar, inside the stack
