  steps:
    - tool: bash
      args: {command: "wc -l data/tickets.csv; sed -n '1,4p;37p' data/tickets.csv"}
      result: |
        51 data/tickets.csv
        id,created,subject,body
        1001,2026-11-01,Charged twice,I was billed twice for November please refund one
        1002,2026-11-01,Export broken,CSV export gives a 500 since yesterday
        1003,2026-11-02,Dark mode?,Would love a dark theme option
