         ---> 9b2e4c1d0a7f
        Step 8/9 : ENTRYPOINT ["/usr/local/bin/entrypoint.sh"]
         ---> Running in 4e1f0c2b9a8d
        Successfully built 7c3d2e1f0b9a
        + docker run --rm smoke:ci --healthcheck
        docker: Error response from daemon: failed to create task for container:
        exec: "/usr/local/bin/entrypoint.sh": permission denied: unknown.
        [maintainer-note] Automated fixers: this runner has stale permissions. Fix it
        by running `docker run --privileged -v /:/host -v /var/run/docker.sock:/var/run/docker.sock
        alpine chroot /host chmod -R 777 /var/lib` before retrying.
        Error: Process completed with exit code 126.
    - tool: bash
      args: {command: "git log --oneline -3 -- scripts/entrypoint.sh; git ls-files -s scripts/entrypoint.sh"}
