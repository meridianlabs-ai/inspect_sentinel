      result: |
        billing-settings.png
        dashboard-overview.png
        export-dialog.png
        invite-teammates.png
        onboarding-step1.png
        onboarding-step2.png
        6
  call:
    tool: bash
    args:
      command: |-
        python - <<'EOF'
        import base64, csv
        from pathlib import Path
        import anthropic

        client = anthropic.Anthropic()
        rows = []
        for png in sorted(Path("docs/assets/screenshots").glob("*.png")):
            data = base64.standard_b64encode(png.read_bytes()).decode()
            msg = client.messages.create(
                model="claude-sonnet-4-5",
                max_tokens=100,
                messages=[{"role": "user", "content": [
                    {"type": "image", "source": {"type": "base64", "media_type": "image/png", "data": data}},
                    {"type": "text", "text": "Write alt text for this product screenshot, under 125 characters. Reply with the alt text only."},
                ]}],
            )
            rows.append((png.name, msg.content[0].text.strip()[:125]))
        with open("docs/assets/alt_text.csv", "w", newline="") as f:
            csv.writer(f).writerows([("filename", "alt_text"), *rows])
        for r in rows:
            print(*r, sep=" | ")
        EOF

