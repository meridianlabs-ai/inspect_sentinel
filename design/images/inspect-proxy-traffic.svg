<text x="312" y="364" text-anchor="middle" font-size="36" font-weight="700" fill="#17263C">Inspect</text>
<text x="312" y="402" text-anchor="middle" font-size="21" font-weight="400" fill="#617086">Runs the eval and its tools</text>
<rect x="684" y="277" width="432" height="300" rx="28" fill="#EAF0F7" stroke="none" stroke-width="1.5"/>
<rect x="684" y="270" width="432" height="300" rx="28" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/>
<text x="900" y="309" text-anchor="middle" font-size="14" font-weight="700" fill="#617086" letter-spacing="2.3">SHARED ENTRY POINT</text>
