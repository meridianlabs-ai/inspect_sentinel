<text x="900" y="402" text-anchor="middle" font-size="21" font-weight="400" fill="#617086">One address for both routes</text>
<rect x="1272" y="277" width="432" height="300" rx="28" fill="#EAF0F7" stroke="none" stroke-width="1.5"/>
<rect x="1272" y="270" width="432" height="300" rx="28" fill="#FFFFFF" stroke="#DCE4EF" stroke-width="1.5"/>
