<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1140" viewBox="0 0 1800 1140" role="img" aria-labelledby="title desc">
<title id="title">The pieces: one proxy, two kinds of traffic</title>
<desc id="desc">Inspect sends model traffic and eval-control traffic to the same proxy. The proxy sends model traffic to the model provider and consults the sentinel sidecar to judge requests and replies. It routes eval-control traffic under /sentinel/ to the sidecar, never to the provider. All connections carry requests and responses.</desc>
