<g font-family="Arial, sans-serif">
<text x="900" y="82" text-anchor="middle" font-size="49" font-weight="700" fill="#17263C">One proxy, two kinds of traffic</text>
<text x="900" y="127" text-anchor="middle" font-size="22" font-weight="400" fill="#617086">The pieces</text>
