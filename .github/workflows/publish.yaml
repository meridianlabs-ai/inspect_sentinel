name: Publish Package

on:
  # Auto-publish when Release Please cuts a GitHub Release (App token triggers
  # this). Runs in-repo, so the PyPI trusted-publisher config (workflow
  # publish.yaml) is unchanged.
  release:
    types: [published]
  # Manual break-glass path.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm PyPI publication'
        required: true
        type: string

jobs:
  # Post the "awaiting approval" Slack ping — un-gated, in this same run, so it
  # deep-links to the run whose publish job is paused on the pypi environment.
  notify-approval:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: meridianlabs-ai/actions/slack-approval-ping@6fe6acfaeb946d22dd4fb673c744a3591eab0d91 # main
        with:
          webhook: ${{ secrets.SLACK_APPROVALS_WEBHOOK_URL }}
          approvers: "jjallaire dragonstyle epatey"
          message: ":rocket: *${{ github.repository }}* ${{ github.event.release.tag_name }} — PyPI publish is *awaiting approval*."
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # The build runs in the shared workflow, in a job with no publishing credential.
  # It uses the hashed scripts/build-dist/requirements.txt, which Dependabot
  # updates. To update the file by hand, run in scripts/build-dist:
  #   uv pip compile --no-config --generate-hashes --python-version 3.11 \
  #     --python-platform x86_64-unknown-linux-gnu --exclude-newer "7 days" \
  #     --only-binary :all: --upgrade requirements.in -o requirements.txt
  build:
    permissions:
      contents: read
    uses: meridianlabs-ai/actions/.github/workflows/build-python-dist.yml@b6f97e6b72216233d805ce570ceb7fa2071f8a93 # main
    with:
      python-version: "3.13"

  publish:
    needs: build
    if: ${{ github.event_name == 'release' || inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # Required for OIDC/trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/p/inspect-sentinel

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  # Announce the release in Slack once it is on PyPI, as inspect_ai,
  # inspect_flow and inspect_swarm do. The shared action does nothing while the
  # SLACK_WEBHOOK_URL secret (an incoming webhook for the announcement channel)
  # is unset. A manual dispatch announces nothing: it has no release.
  announce:
    name: Announce in Slack
    needs: publish
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: meridianlabs-ai/actions/slack-release-announce@65f1b6bdb9b1af7eb0bc89942c624dd4efef1316 # main, 2026-11-02
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: ":rocket: inspect-sentinel ${{ github.event.release.tag_name }} released"
          release-url: ${{ github.event.release.html_url }}
          release-body: ${{ github.event.release.body }}

  # Deploy the docs site for this release once the package is on PyPI.
  docs:
    needs: publish
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: meridianlabs-ai/actions/.github/workflows/publish-docs.yml@4e0837bf4c5b33db42a349f3bed4ea2cb1980269 # main
    with:
      python-version: "3.13"
      extras: doc
