name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: meridianlabs-ai/actions/.github/workflows/release-please-python.yml@b63bc2bb3cc6a615e83e27d5465cb87dd27379b9 # main
    with:
      # Publish runs in publish.yaml on the `release` event, behind its own
      # environment gate, and posts the approval ping from there so the ping
      # deep-links to the paused run.
      approval-ping: false
    # Only the secrets the reusable workflow uses, not `secrets: inherit`, so
    # the other repository and organization secrets stay out of it.
    # SLACK_APPROVALS_WEBHOOK_URL is left out: the workflow uses it only when
    # approval-ping is true.
    secrets:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
