name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    uses: meridianlabs-ai/actions/.github/workflows/release-please-python.yml@57adfb7a3247f06e4f1c033f461a54e0d83d04f5 # main
    with:
      # Publish runs in publish.yaml on the `release` event, behind its own
      # environment gate, and posts the approval ping from there so the ping
      # deep-links to the paused run.
      approval-ping: false
    secrets: inherit
