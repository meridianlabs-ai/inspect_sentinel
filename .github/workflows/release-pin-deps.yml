name: Pin inspect_ai and inspect_scout for release

# Development and CI track inspect_ai's and inspect_scout's main:
# pyproject.toml's [tool.uv.sources] points inspect-ai and inspect-scout at
# their main branches, and every CI install moves them to main's latest commit
# (.github/actions/uv-sync). A published sentinel requires released packages
# through the `inspect-ai>=` and `inspect-scout>=` floors in [project] (PyPI
# rejects direct-reference deps, and only uv reads [tool.uv.sources]). On the
# release PR, CI ignores the git sources and installs the newest inspect-ai and
# inspect-scout releases that clear their cooldown. This workflow raises the
# floors to those releases, so the declared minimum is the version the release
# was tested against. Main keeps the git sources throughout.
#
# Runs on release-PR events and on a schedule: publishing a new inspect_ai or
# inspect_scout to PyPI produces no event in this repo, so the schedule is what
# turns "inspect shipped the fix we need" into "the release PR raises its
# floor" without a human nudge. If sentinel needs an unreleased inspect_ai or
# inspect_scout, the release PR's checks fail, which is the signal to cut a
# release of that package first.
#
# `uv lock` may build sdists to read their metadata, which runs dependency
# code. So the floor job holds only a read-only token that checkout doesn't
# persist, and restores no cache. It hands the push job only version strings
# and the commit it read. That commit only detects a release branch that moved:
# code that `uv lock` runs can change it. The push job holds the App token and
# installs and runs nothing from the repo. It checks out the release branch by
# name, which is the safeguard. It stops unless that is the commit the floor
# job read, checks that each string is a version, and writes it into
# pyproject.toml.

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-pin-deps
  cancel-in-progress: false

jobs:
  floor:
    # PR events: only the Release Please release PR. Schedule/dispatch: always
    # start; the first step exits quietly when no release PR is open.
    if: ${{ github.event_name != 'pull_request' || github.head_ref == 'release-please--branches--main' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.floor.outputs.sha }}
      inspect-ai: ${{ steps.floor.outputs.inspect-ai }}
      inspect-scout: ${{ steps.floor.outputs.inspect-scout }}
      changed: ${{ steps.floor.outputs.changed }}
    steps:
      - name: Check an open release PR exists (scheduled runs)
        id: relpr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(gh pr list --repo "${{ github.repository }}" \
                --head release-please--branches--main --state open \
                --json number --jq 'length')
          if [ "$n" -gt 0 ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No open release PR; nothing to pin."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.relpr.outputs.found == 'true'
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'release-please--branches--main' }}
          persist-credentials: false

      - name: Install uv
        if: steps.relpr.outputs.found == 'true'
        uses: meridianlabs-ai/actions/setup-uv@6fe6acfaeb946d22dd4fb673c744a3591eab0d91 # main
        with:
          actions-cache: none

      # -I keeps the checkout off sys.path, so a module at the release branch's
      # root can't shadow the stdlib.
      - name: Find the releases the release PR is tested against
        id: floor
        if: steps.relpr.outputs.found == 'true'
        run: |
          # This SHA only detects a release branch that moved. Code that `uv lock`
          # runs can change it, so push-floor checks out the branch by name.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          floors=$(python3 -I .github/scripts/release_floors.py)
          echo "$floors"
          echo "$floors" >> "$GITHUB_OUTPUT"
          changed=false
          # Each line is <package>=<version>. A change is due unless every
          # "<package>>=" requirement is "<package>>=<version>".
          for floor in $floors; do
            package=${floor%%=*}
            found=$(sed -nE "s/.*(\"$package>=[^\"]*\").*/\1/p" pyproject.toml | sort -u)
            [ "$found" = "\"$package>=${floor#*=}\"" ] || changed=true
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  push-floor:
    needs: floor
    if: needs.floor.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      # App token so the floor commit re-triggers the PR's checks (guard + build).
      # A commit pushed with the default GITHUB_TOKEN would not trigger them.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}

      # The release branch by name, never a commit the floor job names: code
      # that `uv lock` ran could change the floor job's HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release-please--branches--main
          token: ${{ steps.app-token.outputs.token }}

      # If the branch has moved since the floor job read it, stop; the next run
      # retries. A move after this check makes the push below fail.
      - name: Check the release branch is the commit the floor job read
        env:
          FLOOR_SHA: ${{ needs.floor.outputs.sha }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$FLOOR_SHA" ]; then
            echo "::error::The release branch is not at the commit the floor job read. The next run retries."
            exit 1
          fi

      - name: Commit and push the floors
        env:
          INSPECT_AI: ${{ needs.floor.outputs.inspect-ai }}
          INSPECT_SCOUT: ${{ needs.floor.outputs.inspect-scout }}
        run: |
          for floor in "inspect-ai=$INSPECT_AI" "inspect-scout=$INSPECT_SCOUT"; do
            package=${floor%%=*}
            version=${floor#*=}
            if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
              echo "::error::Not a release version of $package: $version"
              exit 1
            fi
            sed -i -E "s/\"$package>=[^\"]*\"/\"$package>=$version\"/" pyproject.toml
            # Every "<package>>=" requirement (inspect-scout has two), and at least one.
            found=$(sed -nE "s/.*(\"$package>=[^\"]*\").*/\1/p" pyproject.toml | sort -u)
            if [ "$found" != "\"$package>=$version\"" ]; then
              echo "::error::Expected each $package>= requirement in pyproject.toml to be $package>=$version"
              exit 1
            fi
          done
          git config user.name "meridian-release-bot[bot]"
          git config user.email "meridian-release-bot[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: raise the inspect_ai and inspect_scout floors to the releases they were tested against"
          git push origin HEAD:release-please--branches--main
