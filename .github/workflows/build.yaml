name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

# Every job here only reads the repo, so the token gets no more than that.
permissions:
  contents: read

jobs:
  py-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ruff version uv.lock pins, not the newest release.
      - uses: meridianlabs-ai/actions/install-python-dependencies@57adfb7a3247f06e4f1c033f461a54e0d83d04f5 # main
        with:
          versions: locked
          python-version: "3.13"
          extras: dev
      - name: Lint with Ruff
        run: uv run --no-sync ruff check
      - name: Format with Ruff
        run: uv run --no-sync ruff format --check
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-pyright:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: meridianlabs-ai/actions/install-python-dependencies@57adfb7a3247f06e4f1c033f461a54e0d83d04f5 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Run pyright
        run: .venv/bin/pyright
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: meridianlabs-ai/actions/install-python-dependencies@57adfb7a3247f06e4f1c033f461a54e0d83d04f5 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Run tests
        run: .venv/bin/pytest
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  # The LiteLLM guardrail is a package of its own, which runs in LiteLLM's
  # process and never beside this one, so it is tested and checked in an
  # environment of its own for each LiteLLM version it supports.
  litellm-guardrail:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
        litellm-version: ["1.83.0", "1.105.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The sidecar, which the tests start, from this repository's environment.
      # No Actions cache: the guardrail's environment below has none, and both
      # calls in a job use the same setup.
      - uses: meridianlabs-ai/actions/install-python-dependencies@57adfb7a3247f06e4f1c033f461a54e0d83d04f5 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          extras: dev
          actions-cache: none
      # The environment of `make test-litellm` and `make check-litellm`: the
      # guardrail, the matrix LiteLLM and the test tools, with no cooldown, as
      # the Makefile has it.
      - name: Install the guardrail's environment
        uses: meridianlabs-ai/actions/install-python-dependencies@57adfb7a3247f06e4f1c033f461a54e0d83d04f5 # main
        with:
          versions: unlocked
          python-version: ${{ matrix.python-version }}
          project-dir: src/proxies/litellm
          project-install: editable
          project-uv-settings: ignore
          actions-cache: none
          environment-dir: ${{ runner.temp }}/litellm-venv
          also-install-unlocked: |
            litellm[proxy]==${{ matrix.litellm-version }}
            pytest
            pytest-timeout
            pytest-xdist
            jsonschema
            httpx
            anthropic>=2
            pyright
      - name: Run the guardrail's tests
        working-directory: src/proxies/litellm
        run: |
          "$RUNNER_TEMP/litellm-venv/bin/pytest" -n auto
      - name: Run pyright on the guardrail
        working-directory: src/proxies/litellm
        # --pythonpath: no Python on PATH has the guardrail's packages.
        run: |
          "$RUNNER_TEMP/litellm-venv/bin/pyright" --pythonpath "$RUNNER_TEMP/litellm-venv/bin/python"
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build toolchain that publish.yaml uses, pinned with hashes. To
      # update the file, see publish.yaml. No Actions cache, so that the
      # locked install below, which uses the same setup, matches.
      - name: Install build toolchain
        uses: meridianlabs-ai/actions/install-python-dependencies@57adfb7a3247f06e4f1c033f461a54e0d83d04f5 # main
        with:
          versions: hashed-requirements
          python-version: ${{ matrix.python-version }}
          requirements-file: scripts/build-dist/requirements.txt
          package-format: wheels-only
          actions-cache: none
          environment-dir: ${{ runner.temp }}/build-venv
      - name: Build package
        id: build
        run: |
          "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation
          "$RUNNER_TEMP/build-venv/bin/python" -m build --no-isolation src/proxies/litellm --outdir dist-litellm
          wheels=(dist/*.whl)
          [ ${#wheels[@]} -eq 1 ] && [ -f "${wheels[0]}" ] || { echo "::error::expected one wheel in dist/"; exit 1; }
          guardrail=(dist-litellm/*.whl)
          [ ${#guardrail[@]} -eq 1 ] && [ -f "${guardrail[0]}" ] || { echo "::error::expected one wheel in dist-litellm/"; exit 1; }
          # ./ marks a local path for the install action.
          echo "wheel=./${wheels[0]}" >> "$GITHUB_OUTPUT"
          echo "guardrail=./${guardrail[0]}" >> "$GITHUB_OUTPUT"
      # The project's locked dependencies, not the project itself, then the
      # wheel with --no-deps.
      - uses: meridianlabs-ai/actions/install-python-dependencies@57adfb7a3247f06e4f1c033f461a54e0d83d04f5 # main
        with:
          versions: locked
          python-version: ${{ matrix.python-version }}
          project-install: skip
          actions-cache: none
          also-install-without-deps: ${{ steps.build.outputs.wheel }}
      - name: Verify package
        # -I so the import resolves to the installed wheel, not a module at the
        # checkout root.
        run: |
          .venv/bin/python -I -c "import inspect_sentinel, inspect_scout; print('Package imported successfully')"
      # LiteLLM pinned, as in the litellm-guardrail job: the wheel alone would
      # take the newest release.
      - name: Install the LiteLLM guardrail
        uses: meridianlabs-ai/actions/install-python-dependencies@57adfb7a3247f06e4f1c033f461a54e0d83d04f5 # main
        with:
          versions: unlocked
          python-version: ${{ matrix.python-version }}
          project-install: skip
          project-uv-settings: ignore
          actions-cache: none
          environment-dir: ${{ runner.temp }}/guardrail-venv
          also-install-unlocked: |
            litellm[proxy]==1.105.0
            ${{ steps.build.outputs.guardrail }}
      - name: Verify the LiteLLM guardrail
        run: |
          "$RUNNER_TEMP/guardrail-venv/bin/python" -I -c "import inspect_sentinel_litellm; print('Guardrail imported successfully')"
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci
