name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

jobs:
  py-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The ruff version uv.lock pins, not the newest release.
      - name: Lint with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
      - name: Format with Ruff
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version-file: uv.lock
          args: "format --check"

  py-pyright:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/uv-sync
        with:
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Run pyright
        run: .venv/bin/pyright
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/uv-sync
        with:
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Run tests
        run: .venv/bin/pytest
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  # The LiteLLM guardrail is a package of its own, which runs in LiteLLM's
  # process and never beside this one, so it is tested and checked in an
  # environment of its own for each LiteLLM version it supports.
  litellm-guardrail:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
        litellm-version: ["1.83.0", "1.105.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The sidecar, which the tests start, from this repository's environment.
      - uses: ./.github/actions/uv-sync
        with:
          python-version: ${{ matrix.python-version }}
          extras: dev
      - name: Run the guardrail's tests
        run: make test-litellm LITELLM=${{ matrix.litellm-version }}
      - name: Run pyright on the guardrail
        run: make check-litellm LITELLM=${{ matrix.litellm-version }}
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci

  py-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The project's locked dependencies, not the project itself: the step
      # after the build installs the wheel.
      - uses: ./.github/actions/uv-sync
        with:
          python-version: ${{ matrix.python-version }}
          project-install: skip
      - name: Build package
        run: uv build
      - name: Install the package
        run: uv pip install --no-deps dist/*.whl
      - name: Verify package
        # -I so the import resolves to the installed wheel, not a module at the
        # checkout root.
        run: |
          .venv/bin/python -I -c "import inspect_sentinel, inspect_scout; print('Package imported successfully')"
      - name: Build the LiteLLM guardrail
        run: uv build src/proxies/litellm --out-dir dist-litellm
      - name: Verify the LiteLLM guardrail
        # LiteLLM pinned, as in the litellm-guardrail job: the wheel alone
        # would take the newest release
        run: |
          uv run --no-project --with dist-litellm/*.whl --with "litellm[proxy]==1.105.0" python -c "import inspect_sentinel_litellm; print('Guardrail imported successfully')"
      - name: Minimize uv cache
        if: ${{ !cancelled() }}
        run: uv cache prune --ci
