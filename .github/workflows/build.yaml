name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

jobs:
  py-ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v3
      - name: Format with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

  py-pyright:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      # TEMPORARY: the proceed rename needs inspect_ai's SentinelAction with
      # "proceed" (UKGovernmentBEIS/inspect_ai#5822). Remove, with --no-sync below,
      # when #5822 is on inspect_ai main.
      - name: Install inspect_ai (TEMPORARY)
        run: uv pip install --no-deps "inspect_ai @ git+https://github.com/UKGovernmentBEIS/inspect_ai@77dec2567339631cdcef585e3e8ce295a7df76a6"
      - name: Run pyright
        run: uv run --no-sync pyright

  py-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --group dev
      # TEMPORARY: the proceed rename needs inspect_ai's SentinelAction with
      # "proceed" (UKGovernmentBEIS/inspect_ai#5822). Remove, with --no-sync below,
      # when #5822 is on inspect_ai main.
      - name: Install inspect_ai (TEMPORARY)
        run: uv pip install --no-deps "inspect_ai @ git+https://github.com/UKGovernmentBEIS/inspect_ai@77dec2567339631cdcef585e3e8ce295a7df76a6"
      - name: Run tests
        run: uv run --no-sync pytest

  py-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Build package
        run: uv build
      - name: Verify package
        run: |
          uv run --with dist/*.whl python -c "import inspect_sentinel; print('Package imported successfully')"
